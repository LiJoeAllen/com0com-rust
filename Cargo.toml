[workspace]
resolver = "2"
members = [
    # Shared, host-buildable (no_std, no WDK) data/IOCTL definitions.
    "crates/com0com-common",
    # Platform-independent SDK contract and domain model.
    "crates/com0com-core",
    # Backends: Windows kernel driver, Unix user-mode PTY, and a stub.
    "crates/com0com-backend-win",
    "crates/com0com-backend-pty",
    "crates/com0com-backend-stub",
    # Public SDK facade, local JSON-RPC transport and daemon, C ABI.
    "crates/com0com-sdk",
    "crates/com0com-ipc",
    "crates/com0com-daemon",
    "crates/com0com-capi",
    # User-mode configuration tool — a normal std binary, buildable with
    # a plain `cargo build -p com0com-setupc`.
    "tools/setupc",
    # Smoke tests and the generated C header emitter.
    "tools/sdk-smoke",
    "tools/capi-smoke",
    "tools/header-gen",
]

# The two kernel drivers are deliberately NOT workspace members: each of them is
# its own workspace root (see the `[workspace]` table in their Cargo.toml).
#
# Rationale: `wdk-build` walks the *entire* cargo-metadata dependency graph and
# requires exactly ONE WDK driver-model configuration in it. `com0combus`
# declares KMDF 1.33 while `com0comport` declares WDM — the mixed driver model is
# an intentional design decision (see README "架构（混合驱动模型）"). Keeping both
# in a single graph makes *every* build abort with:
#     multiple configurations of the WDK are detected across the dependency
#     graph, but only one configuration is allowed: { Kmdf(1,33), Wdm }
# even when only one driver is selected with `-p`. Splitting them into separate
# workspaces keeps each dependency graph single-configuration.
#
# Build them from their own directory (their `[profile.*] panic = "abort"` is
# honored there as well, because each driver is a workspace root):
#     cargo build --manifest-path crates/com0combus/Cargo.toml
#     cargo build --manifest-path crates/com0comport/Cargo.toml
exclude = [
    "crates/com0combus",
    "crates/com0comport",
]

# A bare `cargo build` only builds the host-buildable crates. The kernel drivers
# cannot be compiled by a bare `cargo build` because they depend on the WDK
# (wdk / wdk-sys / wdk-build). This keeps `cargo build`/`cargo test`/CI green on
# a machine that has no WDK installed.
default-members = [
    "crates/com0com-common",
    "crates/com0com-core",
    "crates/com0com-backend-win",
    "crates/com0com-backend-pty",
    "crates/com0com-backend-stub",
    "crates/com0com-sdk",
    "crates/com0com-ipc",
    "crates/com0com-daemon",
    "crates/com0com-capi",
    "tools/setupc",
    "tools/sdk-smoke",
    "tools/capi-smoke",
    "tools/header-gen",
]

# Single source of truth for version/edition/license of the host-buildable
# crates. The two kernel drivers are excluded workspace roots, so their
# manifests carry their own `[workspace.package]` with the same values —
# bump all three when releasing.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# 全仓库第三方依赖版本的唯一来源（single source of truth）。
# 两个驱动是独立 workspace 根，无法继承本表，只能各自重复声明；
# tools/check-deps.ps1 在 pre-commit 与 CI 中强制它们与本表完全一致。
[workspace.dependencies]
com0com-common = { path = "crates/com0com-common" }
com0com-core = { path = "crates/com0com-core" }
com0com-backend-win = { path = "crates/com0com-backend-win" }
com0com-backend-pty = { path = "crates/com0com-backend-pty" }
com0com-backend-stub = { path = "crates/com0com-backend-stub" }
com0com-sdk = { path = "crates/com0com-sdk" }
com0com-ipc = { path = "crates/com0com-ipc" }
com0com-capi = { path = "crates/com0com-capi" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
base64 = "0.22"
libc = "0.2"
# crates.io 的 windows-sys 仍停在 0.61.2；GitHub tag 74 对应 0.100.0。
windows-sys = { git = "https://github.com/microsoft/windows-rs", tag = "74" }
wdk = "0.4"
wdk-sys = "0.5"
wdk-alloc = "0.4"
wdk-panic = "0.4"
wdk-build = "0.5"

# wdk* 条目只服务于两个被排除的驱动 workspace（它们无法继承本表，只能
# 重复声明，再由 tools/check-deps.ps1 校验一致）。根 workspace 自身没有
# 成员使用它们，Cargo 因此会报 unused_workspace_dependencies 警告。
[workspace.lints.cargo]
unused_workspace_dependencies = "allow"
