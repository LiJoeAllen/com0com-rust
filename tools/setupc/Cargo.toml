[package]
name = "com0com-setupc"
version = "0.1.0"
edition = "2021"
description = "User-mode configuration tool for the Rust com0com virtual null-modem serial driver"
license = "MIT OR Apache-2.0"

# `setupc` is a plain user-mode (std) Win32 console app. Unlike the kernel
# drivers it does NOT need the WDK toolchain — `cargo build` is enough. It
# talks to the bus driver through the private IOCTL_COM0COM_* control codes
# defined in `com0com-common`.

[dependencies]
com0com-common = { path = "../../crates/com0com-common" }

# Lightweight raw Win32 bindings (no build script, no MSVC dependency).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",   # CreateFileW (also needs Win32_Security, below)
    "Win32_Security",             # required by CreateFileW's signature
    "Win32_System_IO",            # DeviceIoControl, OVERLAPPED
    "Win32_Devices_DeviceAndDriverInstallation",
] }

[[bin]]
name = "setupc"
path = "src/main.rs"
