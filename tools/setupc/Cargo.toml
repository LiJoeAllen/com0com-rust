[package]
name = "com0com-setupc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "User-mode configuration tool for the Rust com0com virtual null-modem serial driver"

# `setupc` is a thin, platform-neutral CLI over `com0com-sdk`: argument
# parsing and output formatting live here, all device access is delegated to
# the backend selected by the SDK. It does not need the WDK toolchain.

[dependencies]
com0com-core = { workspace = true }
com0com-sdk = { workspace = true }

[[bin]]
name = "setupc"
path = "src/main.rs"

# 继承根 workspace 的 lint 配置（含 unused_workspace_dependencies = "allow"）。
[lints]
workspace = true
