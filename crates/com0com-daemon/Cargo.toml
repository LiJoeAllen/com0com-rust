[package]
name = "com0com-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "com0comd: local JSON-RPC daemon providing UAC-free pair management"

[dependencies]
com0com-core = { workspace = true, features = ["fake"] }
com0com-ipc = { workspace = true }

[target.'cfg(windows)'.dependencies]
com0com-backend-win = { workspace = true }
windows-sys = { workspace = true, features = [
    "errhandlingapi",
    "handleapi",
    "synchapi",
    "winbase",
    "winerror",
    "winnt",
] }

[target.'cfg(unix)'.dependencies]
com0com-backend-pty = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
com0com-core = { workspace = true, features = ["fake"] }

[[bin]]
name = "com0comd"
path = "src/main.rs"

[lints]
workspace = true
