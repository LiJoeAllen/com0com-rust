[package]
name = "com0com-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "JSON-RPC DTOs, framing, client RemoteBackend and server dispatch for com0comd"

[dependencies]
com0com-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "errhandlingapi",
    "fileapi",
    "handleapi",
    "minwinbase",
    "namedpipeapi",
    "processthreadsapi",
    "sddl",
    "securitybaseapi",
    "synchapi",
    "winbase",
    "winerror",
    "winnt",
] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
com0com-core = { workspace = true, features = ["fake"] }

[lints]
workspace = true
