[package]
name = "com0comport"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WDM port function driver for the Rust com0com rewrite. Handles IOCTL_SERIAL_* and the cross-port data path."

# Own workspace root. The root workspace `exclude`s this crate because wdk-build
# requires exactly one WDK driver-model configuration per dependency graph, and
# com0combus declares KMDF while this crate declares WDM. Being a workspace root
# also means the `[profile.*]` sections below are honored instead of being
# ignored with a cargo warning.
[workspace]

# Keep in sync with the root workspace and com0combus (separate roots cannot
# inherit from each other).
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Single source of truth for this workspace. The wdk* versions must match
# crates/com0combus/Cargo.toml (the two drivers are separate roots).
[workspace.dependencies]
com0com-common = { path = "../com0com-common" }
wdk-sys = "0.4"
wdk-alloc = "0.3"
wdk-panic = "0.4"
wdk-build = "0.5"

[dependencies]
com0com-common = { workspace = true }
wdk-sys = { workspace = true }
wdk-alloc = { workspace = true }
wdk-panic = { workspace = true }

[build-dependencies]
wdk-build = { workspace = true }

[lib]
crate-type = ["cdylib"]

# Kernel-mode has no unwinding runtime.
[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"

# crates.io 的 wdk-sys 只预生成 KMDF bindings；在装有 WDK 的机器上，
# wdk-build 会按此元数据用 WDK 头文件重新生成 WDM bindings（需要 libclang 18–20，见 README）。
[package.metadata.wdk.driver-model]
driver-type = "WDM"
