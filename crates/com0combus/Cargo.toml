[package]
name = "com0combus"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "KMDF bus driver for the Rust com0com rewrite. Enumerates virtual port PDOs and owns the shared per-pair state."

# Own workspace root. The root workspace `exclude`s this crate because wdk-build
# requires exactly one WDK driver-model configuration per dependency graph, and
# com0comport declares WDM while this crate declares KMDF. Being a workspace root
# also means the `[profile.*]` sections below are honored instead of being
# ignored with a cargo warning.
[workspace]

# Keep in sync with the root workspace and com0comport (separate roots cannot
# inherit from each other).
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Single source of truth for this workspace. The wdk* versions must match
# crates/com0comport/Cargo.toml (the two drivers are separate roots).
[workspace.dependencies]
com0com-common = { path = "../com0com-common" }
wdk = "0.4"
wdk-sys = "0.5"
wdk-alloc = "0.4"
wdk-panic = "0.4"
wdk-build = "0.5"

[dependencies]
com0com-common = { workspace = true }
wdk = { workspace = true }
wdk-sys = { workspace = true }
wdk-alloc = { workspace = true }
wdk-panic = { workspace = true }

[build-dependencies]
wdk-build = { workspace = true }

[lib]
crate-type = ["cdylib"]

# Kernel-mode has no unwinding runtime.
[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"

# KMDF v1.33 is the configuration published on crates.io.
[package.metadata.wdk.driver-model]
driver-type = "KMDF"
kmdf-version-major = 1
target-kmdf-version-minor = 33
